<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIGENIS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #334155;
    }
    nav {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      color: var(--text);
      text-decoration: none;
    }
    nav a.link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    nav a.link:hover {
      color: var(--accent);
    }
    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 4rem 2rem;
      display: flex;
      align-items: center;
    }
    .content {
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-top: 0;
      margin-bottom: 1rem;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.1rem;
    }
    footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid #334155;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a {
      color: var(--muted);
      text-decoration: underline;
    }
    footer a:hover {
      color: var(--text);
    }
  </style>
